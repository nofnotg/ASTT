<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASTT 2026 Paper 투자 대시보드</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <aside class="side">
    <div class="brand">ASTT</div>
    <button data-view="overview" class="active">투자현황</button>
    <button data-view="records">월/주/일 기록</button>
    <button data-view="trades">매매 로그</button>
    <button data-view="decisions">시나리오 로그</button>
    <button data-view="routes">시나리오 비교</button>
    <button data-view="validation">검증/2월</button>
    <button data-view="risk">하락장/ATR</button>
    <button data-view="control">관제</button>
  </aside>
  <main>
    <header>
      <div>
        <h1>2026 Paper / Forward 투자 대시보드</h1>
        <p>2026-01-01 이후 paper 투자 기록과 forward 관찰 기록을 한국어로 모니터링합니다. 실거래는 비활성입니다.</p>
      </div>
      <div class="status" id="status">확인 중</div>
    </header>
    <section class="grid" id="cards"></section>
    <section class="panel">
      <div class="panel-head">
        <h2 id="view-title">Overview</h2>
        <button id="refresh">새로고침</button>
      </div>
      <div id="content"></div>
    </section>
  </main>
  <script src="/static/dashboard.js"></script>
</body>
</html>
