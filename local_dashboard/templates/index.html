<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASTT 2026 Paper 투자 대시보드</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <aside class="side">
    <div class="brand">ASTT</div>
    <button data-view="overview" class="active">투자 현황</button>
    <button data-view="records">월/주/일 기록</button>
    <button data-view="logs">매매/판단 로그</button>
    <button data-view="scenarios">시나리오 결론</button>
    <button data-view="improvement">개선 루프</button>
    <button data-view="vwap">VWAP/낙폭</button>
    <button data-view="research">연구 보관</button>
  </aside>
  <main>
    <header>
      <div>
        <h1>ASTT Paper 투자 현황판</h1>
        <p>2026-01-01부터의 paper 투자, 시나리오 검증, 낙폭 방어 연구를 보기 전용으로 표시합니다.</p>
      </div>
      <div class="status" id="status">확인 중</div>
    </header>
    <section class="grid" id="cards"></section>
    <section class="panel">
      <div class="panel-head">
        <h2 id="view-title">Overview</h2>
        <button id="refresh">새로고침</button>
      </div>
      <div id="content"></div>
    </section>
  </main>
  <script src="/static/dashboard.js"></script>
</body>
</html>
